package:
  name: enums
  description: Operations for sequentially ordered types.
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 6.0.2
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-enums
  dependencies:
    - control: ">=6.0.0 <7.0.0"
    - either: ">=6.0.0 <7.0.0"
    - gen: ">=4.0.0 <5.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - nonempty: ">=7.0.0 <8.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unfoldable: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - assert: ">=6.0.0 <7.0.0"
      - console: ">=6.0.0 <7.0.0"
      - effect: ">=4.0.0 <5.0.0"
workspace: {}
